<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- TV Stand Base -->
  <ellipse cx="400" cy="490" rx="140" ry="16" fill="#334155"/>
  <rect x="385" y="440" width="30" height="50" rx="4" fill="#475569"/>

  <!-- TV Frame -->
  <rect x="120" y="140" width="560" height="310" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
  <rect x="135" y="155" width="530" height="280" rx="6" fill="url(#screenGrad)"/>

  <!-- Screen Content Graphic -->
  <circle cx="400" cy="295" r="70" fill="#ffffff" opacity="0.2"/>
  <polygon points="380,260 430,295 380,330" fill="#ffffff"/>

  <text x="400" y="390" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle" letter-spacing="2">4K ULTRA HD OLED</text>

  <!-- Badge -->
  <rect x="290" y="70" width="220" height="40" rx="20" fill="#38bdf8" opacity="0.25"/>
  <text x="400" y="95" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">NEXT-GEN CINEMA TV</text>
</svg>
