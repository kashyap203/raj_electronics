<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311b92" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="220" fill="url(#amberGlow)"/>

  <!-- Main Showcase Container -->
  <rect x="180" y="140" width="440" height="320" rx="20" fill="#0f172a" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  
  <text x="400" y="240" fill="#fbbf24" font-family="sans-serif" font-weight="extrabold" font-size="36" text-anchor="middle">MEGA FESTIVAL SALE</text>
  <text x="400" y="290" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle">UP TO 40% OFF</text>
  <text x="400" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="18" text-anchor="middle">TVs • Refrigerators • ACs • Washers</text>
  
  <rect x="280" y="380" width="240" height="50" rx="25" fill="#f59e0b"/>
  <text x="400" y="412" fill="#0f172a" font-family="sans-serif" font-weight="extrabold" font-size="18" text-anchor="middle">EXCLUSIVE OFFERS</text>
</svg>
