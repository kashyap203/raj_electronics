<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="260" r="180" fill="url(#cyanGlow)"/>
  
  <!-- Air Conditioner Body -->
  <rect x="180" y="180" width="440" height="150" rx="16" fill="url(#acGrad)" stroke="#94a3b8" stroke-width="3"/>
  <rect x="200" y="295" width="400" height="18" rx="6" fill="#94a3b8"/>
  <line x1="200" y1="210" x2="600" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Digital Display -->
  <rect x="530" y="225" width="60" height="30" rx="6" fill="#0f172a"/>
  <text x="560" y="246" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">18°C</text>

  <!-- Cooling Air Waves -->
  <path d="M 240 340 Q 260 420 220 480" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 320 340 Q 340 430 300 500" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 400 340 Q 420 430 380 500" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 480 340 Q 500 430 460 500" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 560 340 Q 580 420 540 480" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Badge Text -->
  <rect x="290" y="80" width="220" height="40" rx="20" fill="#38bdf8" opacity="0.2"/>
  <text x="400" y="105" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">5-STAR INVERTER AC</text>
</svg>
